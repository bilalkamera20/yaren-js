name: Nernur Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    # Git işlemleri için gerekli izinler
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install axios

      - name: Run update script
        run: node balkica.js

      - name: Commit and push changes if nernur.txt updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nernur.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik nernur.txt güncellemesi [skip ci]" && git push)
