name: Nernur Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # İhtiyacınıza göre çalışma sıklığını ayarlayabilirsiniz

jobs:
  build:
    runs-on: ubuntu-24.04 # 'ubuntu-latest' yerine sürüm sabitlendi, uyarı ortadan kalkar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios

      - name: Run update script
        run: node balkica.js
